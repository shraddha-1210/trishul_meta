version: '3.8'

services:
  neo4j:
    image: neo4j:latest
    container_name: trishul-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/trishul123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - trishul-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: trishul-backend
    ports:
      - "8001:8001"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=trishul123
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - trishul-network
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./trishul_history.db:/app/trishul_history.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: trishul-frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    networks:
      - trishul-network
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  trishul-network:
    driver: bridge
